name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: lint · typecheck · test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # node --test with a glob pattern needs Node >= 21
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # bin/build.js also guards that every package.json export resolves —
      # otherwise that only runs at prepack, i.e. on publish.
      - name: Build
        run: npm run build

      - name: Pack (dry run)
        run: npm pack --dry-run

      # docs/API.md is generated from the .d.ts; fail if it's out of date.
      - name: API docs in sync
        run: npm run docs && git diff --exit-code docs/API.md
